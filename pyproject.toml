[project]
name = "cpp-stat-bench"
version = "0.0.0"
description = ""
readme = "README.md"
authors = []
requires-python = ">=3.12,<3.14"
dependencies = ["setuptools (>=84.2.0,<85.0.0)"]

[tool.poetry]
packages = [{ include = "scripts" }]

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-approvaltests = "^0.2.4"
fastjsonschema = "^2.22.2"
msgpack = "^1.2.3"

[tool.poetry.group.doc.dependencies]
sphinx = "^9.1.1"
sphinx-orange-book-theme = "^0.22.0"
sphinxcontrib-plantuml = "^0.31"
breathe = "^5.1.0"
myst-parser = "^5.1.0"
sphinx-togglebutton = "^0.4.5"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
cmakelang = "^0.6.13"
doc8 = "^2.0.0"
pre-commit = "^4.7.0"
sphinx-autobuild = "^2025.8.25"
clang-tidy-checker = "^0.7.0"
lcov-cobertura = "^2.1.1"
jsonschema2md = "^1.7.0"
click = "^8.5.0"
isort = "^9.0.2"
pylint = "^4.1.3"
flake8 = "^7.4.1"
mypy = "^2.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.main]
disable = "too-many-instance-attributes,line-too-long,fixme,too-few-public-methods,redefined-outer-name,redefined-builtin,too-many-arguments"
load-plugins = "pylint.extensions.docparams"

[tool.isort]
profile = "black"
