[project]
name = "cpp-stat-bench"
version = "0.0.0"
description = ""
readme = "README.md"
authors = []
requires-python = ">=3.12,<3.14"
dependencies = ["setuptools (>=83.0.0,<84.0.0)"]

[tool.poetry]
packages = [{ include = "scripts" }]

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-approvaltests = "^0.2.4"
fastjsonschema = "^2.21.2"
msgpack = "^1.2.1"

[tool.poetry.group.doc.dependencies]
sphinx = "^9.1.0"
sphinx-orange-book-theme = "^0.21.0"
sphinxcontrib-plantuml = "^0.31"
breathe = "^4.36.0"
myst-parser = "^5.1.0"
sphinx-togglebutton = "^0.4.5"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
cmakelang = "^0.6.13"
doc8 = "^2.0.0"
pre-commit = "^4.6.0"
sphinx-autobuild = "^2025.8.25"
clang-tidy-checker = "^0.6.0"
lcov-cobertura = "^2.1.1"
jsonschema2md = "^1.7.0"
click = "^8.4.2"
isort = "^8.0.1"
pylint = "^4.0.6"
flake8 = "^7.3.0"
mypy = "^2.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.main]
disable = "too-many-instance-attributes,line-too-long,fixme,too-few-public-methods,redefined-outer-name,redefined-builtin,too-many-arguments"
load-plugins = "pylint.extensions.docparams"

[tool.isort]
profile = "black"
